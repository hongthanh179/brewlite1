databases:
  - name: brewlite-db
    databaseName: brewlite
    user: brewlite_user
    plan: free

services:
  # 1. Backend API (NestJS + Prisma)
  - type: web
    name: brewlite-api
    runtime: node
    rootDir: apps/api
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brewlite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Web (Next.js)
  - type: web
    name: brewlite-web
    runtime: node
    rootDir: apps/web
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false